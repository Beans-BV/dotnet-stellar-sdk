name: Update Documentation
on:
  release:
    types: [ published ]
  # Lets the site be rebuilt from main without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout GH pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: docs/_site

      # DocFX loads the projects through MSBuild from this SDK. The former nunit/docfx-action container
      # ran its own .NET, which could not satisfy global.json, so every release since 15.0.0 failed
      # with "Failed to find all versions of .NET Core MSBuild".
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0

      - name: Build Documentation Metadata
        run: docfx metadata docs/docfx.json

      - name: Build Documentation
        run: docfx build docs/docfx.json

      - name: Publish docs to GH Pages
        run: |
          TAG=$(git describe --tags)
          cd docs/_site/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi
          git commit -m "$TAG"
          git push origin gh-pages

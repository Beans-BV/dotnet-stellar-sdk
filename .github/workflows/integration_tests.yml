name: Integration Tests
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
defaults:
  run:
    shell: pwsh
jobs:
  integration_tests:
    runs-on: ubuntu-latest
    # Well above the suite's typical wall-clock (~9 min tests + setup): the fixtures' [CancelAfter]
    # budgets are cooperative-only, so this job timeout is the real backstop under a degraded Testnet.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0.x satisfies global.json (the runner image happened to preinstall it, which is why
          # the old 8.0.x-only pin worked by accident); 8.0.x supplies the runtime the net8.0
          # integration-test project executes on.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run integration tests
        env:
          INTEGRATION_HORIZON_URL:       ${{ vars.INTEGRATION_HORIZON_URL       || 'https://horizon-testnet.stellar.org' }}
          INTEGRATION_HORIZON_TOKEN:     ${{ secrets.INTEGRATION_HORIZON_TOKEN }}
          INTEGRATION_STELLAR_RPC_URL:   ${{ vars.INTEGRATION_STELLAR_RPC_URL   || 'https://soroban-testnet.stellar.org' }}
          INTEGRATION_STELLAR_RPC_TOKEN: ${{ secrets.INTEGRATION_STELLAR_RPC_TOKEN }}
          INTEGRATION_FRIENDBOT_URL:     ${{ vars.INTEGRATION_FRIENDBOT_URL     || 'https://horizon-testnet.stellar.org' }}
          INTEGRATION_SEP10_HOME_DOMAIN: ${{ vars.INTEGRATION_SEP10_HOME_DOMAIN || 'testanchor.stellar.org' }}
          INTEGRATION_HTTP_TIMEOUT_SECONDS: ${{ vars.INTEGRATION_HTTP_TIMEOUT_SECONDS || '45' }}
        run: |
          dotnet test StellarDotnetSdk.IntegrationTests/StellarDotnetSdk.IntegrationTests.csproj `
            --configuration Release `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=integration.trx"
      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-trx
          path: '**/integration.trx'
          if-no-files-found: warn
